# Servidor de la vCard (reemplaza /etc/nginx/conf.d/default.conf de nginx:alpine).
# No usar add_header aquí: las cabeceras vienen de security-headers.conf (nivel http).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
    # La página se revalida siempre (Cache-Control: no-cache) para no mezclar versiones.
    location = /index.html { expires -1; }
    # index.html pide styles.css y js/ con un prefijo de versión (/v20261117b/styles.css).
    # Al cambiarlos, subir la versión en index.html: Cloudflare y el navegador los guardan y sin
    # versión se mezcla HTML nuevo con CSS viejo. Se usa ruta y no ?v= porque la copia de
    # emergencia del guardián descarta las URL con "?".
    location ~ ^/v[0-9]+[a-z]?/ {
        rewrite ^/v[0-9]+[a-z]?/(.+)$ /$1 last;
    }
    location = /styles.css { expires 7d; }
    location /js/ { expires 7d; try_files $uri =404; }
    location /img/ {
        expires 30d;
        try_files $uri =404;
    }
    # Para que el teléfono abra la tarjeta directamente en Contactos.
    location ~* \.vcf$ {
        default_type text/vcard;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
